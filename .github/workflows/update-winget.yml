name: Update Winget (manual)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to submit to Winget (for example v0.6.0)
        required: true
        type: string

jobs:
  submit-winget-update:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PACKAGE_IDENTIFIER: xarthurx.Whisperi
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Normalize and validate inputs
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "Missing WINGET_CREATE_GITHUB_TOKEN secret. Create a GitHub classic PAT with public_repo scope for wingetcreate submissions."
          }

          # Ensure tag has 'v' prefix (handles input like "0.6.0")
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v') { $tag = "v$tag" }
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          Write-Output "Normalized release tag: $tag"

      - name: Install .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download wingetcreate
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Generate Winget manifests
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releaseApiUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG"
          Write-Output "Fetching release from: $releaseApiUrl"
          $release = Invoke-RestMethod -Headers $headers -Uri $releaseApiUrl

          if ($release.draft -or $release.prerelease) {
            throw "Winget submissions only support published non-prerelease GitHub releases."
          }

          $tag = $release.tag_name
          $version = $tag -replace '^v', ''
          $assets = @($release.assets)
          $installerAssets = @($assets | Where-Object { $_.name -like '*_x64-setup.exe' })

          if ($installerAssets.Count -ne 1) {
            throw "Expected exactly one x64 setup asset on release $tag, found $($installerAssets.Count)."
          }

          .\wingetcreate.exe update `
            $env:PACKAGE_IDENTIFIER `
            -u $installerAssets[0].browser_download_url `
            -v $version `
            -o ./manifests

      - name: Fix wingetcreate YAML formatting
        shell: pwsh
        run: |
          $manifestDir = Get-ChildItem -Path ./manifests -Directory -Recurse |
            Where-Object { $_.GetFiles("*.installer.yaml").Count -gt 0 } |
            Select-Object -First 1

          if (-not $manifestDir) { throw "No installer manifest found in ./manifests" }

          # Fix installer.yaml: move ReleaseDate inside each Installers entry
          $installerFile = Join-Path $manifestDir.FullName "$env:PACKAGE_IDENTIFIER.installer.yaml"
          if (Test-Path $installerFile) {
            $lines = Get-Content $installerFile
            $releaseDate = $lines | Where-Object { $_ -match '^ReleaseDate:\s' }
            if ($releaseDate) {
              $value = ($releaseDate -split ':\s*', 2)[1]
              # Remove top-level ReleaseDate line
              $lines = $lines | Where-Object { $_ -notmatch '^ReleaseDate:\s' }
              # Insert indented ReleaseDate before ManifestType
              $result = @()
              foreach ($line in $lines) {
                if ($line -match '^ManifestType:') {
                  $result += "  ReleaseDate: $value"
                }
                $result += $line
              }
              $result | Set-Content $installerFile -Encoding UTF8
              Write-Output "Fixed: moved ReleaseDate inside installer entry"
            }
          }

      - name: Submit Winget manifest
        shell: pwsh
        run: |
          .\wingetcreate.exe submit `
            --token $env:WINGET_CREATE_GITHUB_TOKEN `
            (Get-ChildItem -Path ./manifests -Directory -Recurse |
              Where-Object { $_.GetFiles("*.installer.yaml").Count -gt 0 } |
              Select-Object -First 1).FullName
